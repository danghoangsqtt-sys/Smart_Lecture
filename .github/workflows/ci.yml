name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (server + web, TS strict)
        run: npm run typecheck

      - name: Build production (web + server)
        run: npm run build

      - name: End-to-end tests (isolated SQLite)
        run: node scripts/e2e-isolated.mjs

      - name: Install Chromium for browser E2E
        run: npx playwright install --with-deps chromium

      - name: Browser E2E (isolated SQLite)
        run: node scripts/e2e-browser-isolated.mjs
